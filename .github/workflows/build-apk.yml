name: Build, Sign & Release APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Kod Repository
        uses: actions/checkout@v4

      - name: Setup Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Pasang Dependencies Web
        run: |
          npm install --legacy-peer-deps

      - name: Build Web App (Vite)
        run: |
          npm run build

      - name: Pasang Capacitor & Sediakan Android
        run: |
          rm -f capacitor.config.ts
          npx cap add android

          # Benarkan sambungan cleartext HTTP untuk IP modem 192.168.1.1
          sed -i 's/<application/<application android:usesCleartextTraffic="true"/' android/app/src/main/AndroidManifest.xml
          
          npx cap sync android

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Compile Release APK Guna Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Sign & Align Release APK
        id: sign_app
        run: |
          # Dapatkan direktori Android build-tools versi terkini di runner
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
          echo "Menggunakan Android Build Tools: $BUILD_TOOLS_DIR"
          
          # Nyahkod Keystore daripada GitHub Secrets
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release.keystore
          
          # Cari APK asal yang belum ditandatangani
          APK_UNSIGNED=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          APK_SIGNED="android/app/build/outputs/apk/release/H809Pro-Manager-v1.0.${{ github.run_number }}.apk"
          
          # Zipalign fail APK
          $BUILD_TOOLS_DIR/zipalign -v -p 4 "$APK_UNSIGNED" "$APK_SIGNED"
          
          # Tandatangan APK menggunakan apksigner rasmi Android
          $BUILD_TOOLS_DIR/apksigner sign --ks release.keystore \
            --ks-key-alias "${{ secrets.KEY_ALIAS }}" \
            --ks-pass "pass:${{ secrets.STORE_PASSWORD }}" \
            --key-pass "pass:${{ secrets.KEY_PASSWORD }}" \
            "$APK_SIGNED"
          
          # Sahkan integriti tandatangan APK
          $BUILD_TOOLS_DIR/apksigner verify "$APK_SIGNED"
          
          # Buang fail keystore sementara untuk keselamatan
          rm -f release.keystore
          
          # Salurkan path fail APK ke output workflow
          echo "signedReleaseFile=$APK_SIGNED" >> $GITHUB_OUTPUT

      - name: Simpan APK ke GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: H809Pro-Manager-Signed-APK
          path: ${{ steps.sign_app.outputs.signedReleaseFile }}

      - name: Terbitkan ke GitHub Releases
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          files: ${{ steps.sign_app.outputs.signedReleaseFile }}
          tag_name: v1.0.${{ github.run_number }}
          name: H809Pro Manager v1.0.${{ github.run_number }}
          body: |
            ### H809Pro 4G LTE CPE Manager (Signed Release)
            - APK rasmi siap ditandatangani (*Signed Release*).
            - Sokongan sambungan HTTP get laluan modem `192.168.1.1`.
            - Cipset ASR Cat-4 band lock & telemetri isyarat RSRP/SINR.
            - Auto-compile melalui GitHub Actions.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
