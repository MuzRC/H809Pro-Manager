name: Build, Sign & Release APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Kod Repository
        uses: actions/checkout@v4

      - name: Setup Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Pasang Dependencies Web
        run: |
          npm install --legacy-peer-deps

      - name: Build Web App (Vite)
        run: |
          npm run build

      - name: Pasang Capacitor & Janakan Projek Android
        run: |
          npm install --legacy-peer-deps @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "H809Pro Manager" "com.muz.h809pro" --web-dir dist
          npx cap add android

          # Benarkan sambungan HTTP untuk IP modem 192.168.1.1
          sed -i 's/<application/<application android:usesCleartextTraffic="true"/' android/app/src/main/AndroidManifest.xml
          
          npx cap sync android

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Compile Release APK Guna Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Sign Release APK
        uses: r0adkll/sign-android-release@v1
        id: sign_app
        with:
          releaseDirectory: android/app/build/outputs/apk/release
          signingKey: ${{ secrets.KEYSTORE_BASE64 }}
          keyStorePassword: ${{ secrets.STORE_PASSWORD }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      - name: Simpan APK ke GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: H809Pro-Manager-Signed-APK
          path: ${{ steps.sign_app.outputs.signedReleaseFile }}

      - name: Terbitkan ke GitHub Releases
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          files: ${{ steps.sign_app.outputs.signedReleaseFile }}
          tag_name: v1.0.${{ github.run_number }}
          name: H809Pro Manager v1.0.${{ github.run_number }}
          body: |
            ### H809Pro 4G LTE CPE Manager (Signed Release)
            - APK rasmi siap ditandatangani (*Signed Release*).
            - Sokongan sambungan HTTP get laluan modem `192.168.1.1`.
            - Cipset ASR Cat-4 band lock & telemetri isyarat RSRP/SINR.
            - Auto-compile melalui GitHub Actions.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
